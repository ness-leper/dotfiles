;==========================================================

; This is a complete polybar configuration file.
; You can save it as 'config' in your ~/.config/polybar/ directory.
; Be sure to run 'polybar mybar' to use this configuration.

[colors]
; The beautiful Nord color scheme.
; Nord theme values are used here.
background = #2e3440
foreground = #d8dee9
primary = #88c0d0
secondary = #5e81ac
alert = #bf616a

[bar/mybar]
; Basic bar settings
width = 100%
height = 27
radius = 0
fixed-center = true

; Set the bar position and offset.
bottom = false
offset-x = 0
offset-y = 0

; Set the background and foreground colors.
background = ${colors.background}
foreground = ${colors.foreground}

; Left, center, and right content.
; The modules are separated by a space.
modules-left = i3
modules-center = xwindow
modules-right = cpu wlan pulseaudio date

; Tray and font settings
tray-position = right
font-0 = Iosevka:size=14;2
font-1 = Font Awesome 5 Free:size=10;2
font-2 = Font Awesome 5 Brands:size=10;2

; Enable click and scroll actions for the modules.
enable-ipc = true

[module/i3]
; Module for i3 workspaces
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
strip-wsnumbers = true

; Label format for each workspace state.
label-mode-padding = 1
label-mode-foreground = ${colors.primary}
label-mode-background = ${colors.background}

; Focused workspace label.
label-focused = %index%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

; Unfocused workspace label.
label-unfocused = %index%
label-unfocused-padding = 2

; Urgent workspace label.
label-urgent = %index%!
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background}
label-urgent-padding = 2

; Occupied workspace label (has windows but is not focused).
label-occupied = %index%
label-occupied-padding = 2

; Empty workspace label.
label-empty = %index%
label-empty-foreground = ${colors.foreground}
label-empty-background = ${colors.background}
label-empty-padding = 2

[module/xwindow]
; Module to display the title of the active window.
type = internal/xwindow
label = %title:0:40:...%

[module/pulseaudio]
; Module for volume control using PulseAudio.
type = internal/pulseaudio

; Use `pulsemixer` for better control
use-ui-max = false
interval = 5

; Define the format for volume display.
format-volume = <label-volume>
format-volume-prefix = "♪ "
format-volume-prefix-foreground = ${colors.primary}
format-volume-padding = 1

; Label for the volume percentage.
label-volume = %percentage%%

; Mute format and label.
format-muted = <label-muted>
format-muted-prefix = "M "
label-muted = muted
label-muted-foreground = ${colors.secondary}

; Click actions
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/cpu]
; Module to display CPU usage.
type = internal/cpu
interval = 1
format = <label>
format-prefix = "CPU: "
format-prefix-foreground = ${colors.primary}
format-padding = 1
label = %percentage%%

[module/wlan]
; Module for WLAN status.
type = internal/network
interface = wlan0 ; Replace with your network interface. Use 'ip a' to find it.
interval = 3.0

; Format when connected.
format-connected = <label-connected>
format-connected-prefix = "WLAN: "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid% %signal%%
format-connected-padding = 1

; Format when disconnected.
format-disconnected = <label-disconnected>
format-disconnected-prefix = "WLAN: "
format-disconnected-prefix-foreground = ${colors.primary}
label-disconnected = disconnected
format-disconnected-padding = 1

[module/date]
; Module for displaying the time.
type = internal/date
interval = 1

; Use 12-hour format with AM/PM.
; %I is for hours (12hr format), %M for minutes, and %p for AM/PM.
date = %I:%M %p
; A longer date format, if you want it.
date-alt = %A, %B %d, %Y

; Formatting for the label.
format = <label>
format-prefix = "⏱ "
format-prefix-foreground = ${colors.primary}
label = %date%
label-padding = 1

[settings]
; Settings for all modules.
pseudo-transparency = false
screenchange-reload = true
